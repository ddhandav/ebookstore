# ===================================================================
# E-Bookstore Platform Application Properties (Default Local Profile)
# AI Specialist Capstone Project
# ===================================================================
spring.application.name=ebookstore-api
server.port=8080

# Default Database: H2 In-Memory (Zero configuration needed to run locally)
spring.datasource.url=jdbc:h2:mem:ebookstoredb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (Available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# OpenAPI / Swagger 3 Configuration (Available at http://localhost:8080/swagger-ui.html)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
